<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#f5f4ef"/><stop offset="1" stop-color="#e9eee8"/></linearGradient><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#202b2b"/><stop offset="1" stop-color="#334440"/></linearGradient></defs><rect width="1440" height="1000" fill="url(#b)"/><text x="80" y="55" fill="#182320" font-family="Arial" font-size="26" font-weight="800">THE CUT <tspan fill="#e16d49">STUDIO</tspan></text><g fill="#59635e" font-family="Arial" font-size="15"><text x="660" y="52">Accueil</text><text x="755" y="52">Nos jeux</text><text x="855" y="52">Tournois</text><text x="965" y="52">La salle</text></g><rect x="1190" y="25" width="170" height="45" rx="22" fill="#e16d49"/><text x="1224" y="53" fill="#fff" font-family="Arial" font-size="14" font-weight="700">MES RÉSERVATIONS</text><rect x="64" y="110" width="1312" height="315" rx="26" fill="url(#hero)"/><circle cx="1150" cy="275" r="150" fill="#e16d49" opacity=".16"/><text x="110" y="174" fill="#f2be9f" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">TON MOMENT, TON SETUP</text><text x="110" y="242" fill="#fff" font-family="Arial" font-size="54" font-weight="800">Réserve ta prochaine</text><text x="110" y="301" fill="#fff" font-family="Arial" font-size="54" font-weight="800">session de jeu.</text><text x="112" y="345" fill="#d6ded9" font-family="Arial" font-size="17">Choisis une console, une date et un créneau. On s’occupe du reste.</text><rect x="1110" y="180" width="150" height="120" rx="22" fill="#e16d49"/><text x="1148" y="226" fill="#fff" font-family="Arial" font-size="37">🎮</text><text x="1124" y="270" fill="#fff" font-family="Arial" font-size="13" font-weight="700">PS5 READY</text>
